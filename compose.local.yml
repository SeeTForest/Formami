name: forami-local
services:
  database:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: forami
      POSTGRES_USER: forami
      POSTGRES_PASSWORD: ${FORAMI_LOCAL_DB_PASSWORD:?Run local:setup first}
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - forami-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forami -d forami"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  forami-local-data:
