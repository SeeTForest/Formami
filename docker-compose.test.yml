# Compose stack for the API integration test suite (`pnpm test:api`).
#
# This is NOT the deployable stack — see docker-compose.yml for that. Databases
# run on tmpfs and are discarded on `down`, so every run starts from an empty
# schema (migrations + the default admin user are applied by the formami image on
# boot via scripts/start-docker.sh).
#
# Profiles:
#   postgres    formami + Postgres              -> pnpm test:api
#   clickhouse  formami + Postgres + ClickHouse -> pnpm test:api:clickhouse
#
# Environment overrides:
#   FORMAMI_TEST_PORT   host port for the app (default 3100, avoids the dev server on 3000)
#   FORMAMI_TEST_IMAGE  image tag to run/build (default formami-test:local)
#   SKIP_BUILD_GEO    "1" (default) skips the MaxMind download during the image build

x-formami-service: &formami-service
  image: ${FORMAMI_TEST_IMAGE:-formami-test:local}
  build:
    context: .
    args:
      SKIP_BUILD_GEO: ${SKIP_BUILD_GEO:-1}
  ports:
    - "${FORMAMI_TEST_PORT:-3100}:3000"
  init: true
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
    interval: 2s
    timeout: 5s
    retries: 90
    start_period: 20s

x-formami-env: &formami-env
  DATABASE_URL: postgresql://formami:formami@db:5432/formami
  APP_SECRET: formami-api-test-secret
  TWO_FACTOR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  # Playwright/curl user agents are classified as bots; without this /api/send silently drops events.
  DISABLE_BOT_CHECK: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_UPDATES: "1"
  MCP_ENABLED: "1"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: formami
      POSTGRES_USER: formami
      POSTGRES_PASSWORD: formami
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formami -d formami"]
      interval: 2s
      timeout: 5s
      retries: 30

  formami:
    <<: *formami-service
    profiles: [postgres]
    environment: *formami-env
    depends_on:
      db:
        condition: service_healthy

  clickhouse:
    # Pinned to an LTS release. 26.7+ rejects db/clickhouse/schema.sql because
    # website_event_stats_hourly has dimension columns outside the sorting key
    # (see allow_dimensions_outside_sorting_key).
    image: clickhouse/clickhouse-server:25.8
    profiles: [clickhouse]
    environment:
      CLICKHOUSE_DB: formami
      CLICKHOUSE_USER: formami
      CLICKHOUSE_PASSWORD: formami
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    tmpfs:
      - /var/lib/clickhouse
    volumes:
      # The image runs /docker-entrypoint-initdb.d/*.sql on first start (empty data dir).
      - ./tests/api/docker/clickhouse-init/00-create-db.sql:/docker-entrypoint-initdb.d/00-create-db.sql:ro
      - ./db/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # Healthy only once schema.sql has been applied (session_link is the last table it creates).
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user formami --password formami --query \"SELECT throwIf(count() = 0) FROM system.tables WHERE database = 'formami' AND name = 'session_link'\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  formami-clickhouse:
    <<: *formami-service
    profiles: [clickhouse]
    environment:
      <<: *formami-env
      CLICKHOUSE_URL: http://formami:formami@clickhouse:8123/formami
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
